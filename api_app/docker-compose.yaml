services:

  db:
    image: postgres:latest
    container_name: postgres_sellior
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: ${DB_PORT}
    ports:
      - "5434:5434"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: sellior_backend
    command: sh -c "uvicorn api_app.asgi:application --host 0.0.0.0 --port 8004 --reload"
    restart: always
    volumes:
      - .:/app
      # - static_volume:/app/staticfiles
    networks:
      - db-net
      - web-net 
    ports:
      - "8004:8004"
    expose:
      - "8004"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004",]
      start_period: 300s
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7.4.1
    container_name: redis_sellior
    restart: always
    networks:
      - web-net

  celery:
    build: .
    container_name: celery_sellior
    command: celery -A api_app.celery worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - web
      - redis
    networks:
      - web-net
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  celery-beat:
    build: .
    container_name: celery_beat_sellior
    command: celery -A api_app.celery beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - web-net
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0



