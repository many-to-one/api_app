{% extends 'base.html' %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

{% block content %}
<body>

<div id="csrf-token" data-token="{{ csrf_token }}"></div>

<div class="offers__cont" id="of_cont">
    <div class="pdf_container_editor">
        <!-- form for image upload -->
        <div>
            <form id="imageForm" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="file" name="image" id="image" required style="display:none;">
                <button class="buttonDownloadImage" type="button" id="triggerFileInput">Dodaj zjęcie</button>
            </form>
        </div>

        <!-- Add text button -->
        <button class="buttonDownloadImage" id="addText">Dodaj tekst</button>
    </div>

    <div id="PDFArea"></div>

    <button id="downloadCombined" class="buttonDownloadImage" style="margin-top: 20px;">Pobierz</button>

    <canvas id="combinedCanvas" style="display:none;"></canvas> <!-- Hidden Canvas for combining images and text -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>
    const form = document.getElementById('imageForm');
    const inputFile = document.getElementById('image');
    const triggerFileInput = document.getElementById('triggerFileInput');
    const PDFArea = document.getElementById('PDFArea');
    const downloadCombined = document.getElementById('downloadCombined');
    const combinedCanvas = document.getElementById('combinedCanvas');
    let draggedItem = null;
    var newTextWidth = null; 
    var newTextHeight = null; 

    // Define scaling factors
    const widthScale = 1193 / 800;
    const heightScale = 1680 / 1127;
    // const widthScale = parseInt(1193 / PDFArea.style.width);
    // const heightScale = parseInt(1680 / PDFArea.style.height);

    // Open the file dialog when the button is clicked
    triggerFileInput.addEventListener('click', () => {
        inputFile.click();
    });

    // Handle image upload
    inputFile.addEventListener('change', () => {
        if (inputFile.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const resizableContainer = document.createElement('div');
                resizableContainer.classList.add('resizable');
                resizableContainer.style.width = '300px';  // Initial width
                // resizableContainer.style.height = '300px';

                const imgElement = document.createElement('img');
                imgElement.src = event.target.result;
                console.log('imgElement.naturalHeight')
                resizableContainer.style.height = `${(imgElement.naturalHeight / imgElement.naturalWidth) * 300}px`;
                resizableContainer.appendChild(imgElement);

                addResizeHandlers(resizableContainer);
                addDragDropLogic(resizableContainer);

                PDFArea.appendChild(resizableContainer);
            };
            reader.readAsDataURL(inputFile.files[0]);
        }
    });

    // Add resize handles to the element
    function addResizeHandlers(element) {
        const tl = document.createElement('div');
        tl.classList.add('resize-handle', 'tl');
        tl.style.display = 'block';
        const tr = document.createElement('div');
        tr.classList.add('resize-handle', 'tr');
        tr.style.display = 'block';
        const bl = document.createElement('div');
        bl.classList.add('resize-handle', 'bl');
        bl.style.display = 'block';
        const br = document.createElement('div');
        br.classList.add('resize-handle', 'br');
        br.style.display = 'block';

        element.appendChild(tl);
        element.appendChild(tr);
        element.appendChild(bl);
        element.appendChild(br);

        let startX, startY, startWidth, startHeight;

        [tl, tr, bl, br].forEach(handle => {
            handle.addEventListener('mousedown', function (e) {
                e.preventDefault();
                startX = e.clientX;
                startY = e.clientY;
                // startWidth = parseInt(window.getComputedStyle(element).width, 10);
                // startHeight = parseInt(window.getComputedStyle(element).height, 10);
                startWidth = parseInt(window.getComputedStyle(element).width);
                startHeight = parseInt(window.getComputedStyle(element).height);

                // function resizeElement(event) {
                //     if (handle === br || handle === bl) {
                //         element.style.width = `${startWidth - (event.clientX - startX)}px`;
                //         console.log('handle === tl || handle === bl element.style.width', element.style.width)
                //         newTextWidth = (startWidth - (event.clientX - startX)) * widthScale ;
                //         console.log('handle === tl || handle === bl newTextWidth', newTextWidth)
                //     } else {
                //         element.style.width = `${startWidth + (event.clientX - startX)}px`;
                //         console.log('else element.style.width', element.style.width)
                //         newTextWidth = (startWidth + (event.clientX - startX) * widthScale);
                //         console.log('else newTextWidth', newTextWidth)
                //     }

                //     if (handle === tr || handle === tl) {
                //         element.style.height = `${startHeight - (event.clientY - startY)}px`;
                //         newTextHeight = (startHeight - (event.clientY - startY) * heightScale);
                //     } else {
                //         element.style.height = `${startHeight + (event.clientY - startY)}px`;
                //         newTextHeight = (startHeight - (event.clientY - startY) * heightScale);
                //     }
                // }


                function resizeElement(event) {
                    const newWidth = (startWidth + (event.clientX - startX)) * widthScale;
                    const newHeight = (startHeight + (event.clientY - startY)) * heightScale;

                    element.style.width = `${newWidth / widthScale}px`; // Adjust back for HTML
                    element.style.height = `${newHeight / heightScale}px`; // Adjust back for HTML

                    newTextWidth = newWidth;
                    newTextHeight = newHeight;
                }



                document.addEventListener('mousemove', resizeElement);
                document.addEventListener('mouseup', function stopResize() {
                    document.removeEventListener('mousemove', resizeElement);
                    document.removeEventListener('mouseup', stopResize);
                });
            });
        });

        console.log('newTextWidth', newTextWidth)
    }

    // Add drag-and-drop logic to the element
    function addDragDropLogic(element) {
        let isDragging = false;
        let startX, startY;

        element.addEventListener('mousedown', (e) => {
            isDragging = true;
            // startX = e.clientX - parseInt(element.style.left || 0, 10);
            // startY = e.clientY - parseInt(element.style.top || 0, 10);
            startX = e.clientX - parseInt(element.style.left || 0);
            startY = e.clientY - parseInt(element.style.top || 0);
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                element.style.left = `${e.clientX - startX}px`;
                element.style.top = `${e.clientY - startY}px`;
            }
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    }

   // Adding text to the thumbnail area
   let textName = 0;
        document.getElementById('addText').addEventListener('click', () => {
            const textElement = document.createElement('div');
            textElement.classList.add('resizable-text');
            textElement.id = 'resizableText';
            textElement.innerText = "Napisz coś...";
            textElement.style.width = '200px';
            textElement.style.height = '50px';
            textElement.style.border = '1px solid #000';
            textElement.style.position = 'absolute'; // Ensure it can be positioned freely
            textElement.style.left = '20px';
            textElement.style.top = '20px';
            textElement.contentEditable = true; // Start with text editable

            // Ensure text wraps within the div and doesn't overflow
            // textElement.style.overflow = 'hidden'; 
            textElement.style.wordWrap = 'break-word'; 
            textElement.style.whiteSpace = 'pre-wrap';

            // Add drag and resize logic
            addResizeHandlers(textElement);
            addDragDropLogic(textElement);

            // Append to thumbnail area
            PDFArea.appendChild(textElement);

            // Toggle editable mode on double-click
            textElement.addEventListener('click', () => {
                textElement.contentEditable = true;
                textElement.focus(); // Focus the text element when double-clicked              
            });

            // Set contentEditable to false when clicking outside the text element
            document.addEventListener('click', (e) => {
                if (e.target !== textElement && textElement.contentEditable === 'true') {
                    textElement.contentEditable = false;
                }
            });
        });



        downloadCombined.addEventListener('click', function () {
            const items = PDFArea.querySelectorAll('.resizable, .resizable-text');

            const canvasWidth = 1193; // Desired canvas size in pixels
            const canvasHeight = 1680;
            combinedCanvas.width = canvasWidth;
            combinedCanvas.height = canvasHeight;

            const ctx = combinedCanvas.getContext('2d');
            ctx.clearRect(0, 0, canvasWidth, canvasHeight); // Clear the canvas

            let imagesLoaded = 0; // Counter for loaded items
            const totalItems = items.length; // Total number of items
            const widthScale = canvasWidth / 800; // Adjust to your dimensions
            const heightScale = canvasHeight / 1127;

            items.forEach(item => {
                const xPos = parseInt(item.style.left) * widthScale || 0;
                const yPos = parseInt(item.style.top) * heightScale || 0;

                if (item.tagName === 'DIV' && item.classList.contains('resizable-text')) {
                    // Handle text rendering
                    const fontSize = parseInt(item.style.fontSize) * widthScale || 20 * widthScale;
                    ctx.font = `${fontSize}px sans-serif`;
                    ctx.fillStyle = '#000'; // Text color

                    const maxWidth = parseInt(item.style.width) * widthScale || canvasWidth; // Rescale max width
                    const text = item.innerText;
                    const lineHeight = fontSize * 1.2;

                    // Function to wrap text
                    function wrapText(context, text, x, y, maxWidth, lineHeight) {
                        const lines = text.split('\n'); // Split the text by line breaks first
                        lines.forEach(line => {
                            const words = line.split(' '); // Then split each line into words
                            let currentLine = '';

                            for (let n = 0; n < words.length; n++) {
                                const testLine = currentLine + words[n] + ' ';
                                const metrics = context.measureText(testLine);
                                const testWidth = metrics.width;

                                if (testWidth > maxWidth && n > 0) {
                                    context.fillText(currentLine, x, y);
                                    currentLine = words[n] + ' ';
                                    y += lineHeight;
                                } else {
                                    currentLine = testLine;
                                }
                            }
                            context.fillText(currentLine, x, y);
                            y += lineHeight;
                        });
                    }

                    wrapText(ctx, text, xPos, yPos, maxWidth, lineHeight);
                    imagesLoaded += 1;
                    checkCompletion(); // Check if all items are processed
                } else if (item.querySelector('img')) {
                    // Handle image rendering
                    const imgElement = new Image();
                    imgElement.src = item.querySelector('img').src;

                    imgElement.onload = function () {
                        const containerWidth = item.offsetWidth * widthScale;
                        const containerHeight = item.offsetHeight * heightScale;

                        ctx.drawImage(imgElement, xPos, yPos, containerWidth, containerHeight);
                        imagesLoaded += 1;
                        checkCompletion(); // Check if all items are processed
                    };

                    imgElement.onerror = function () {
                        console.error("Failed to load image:", imgElement.src);
                        imagesLoaded += 1;
                        checkCompletion(); // Prevent hanging on error
                    };
                } else {
                    // Non-image, non-text items
                    imagesLoaded += 1;
                    checkCompletion(); // Check if all items are processed
                }
            });

            // Function to check completion
            function checkCompletion() {
                if (imagesLoaded === totalItems) {
                    triggerDownload(); // All items have been processed
                }
            }
        // });

            function triggerDownload() {
                console.log('triggerDownload');
                const { jsPDF } = window.jspdf; // Access jsPDF
                const pdf = new jsPDF('p', 'px', [1193, 1680]); // Create a new jsPDF instance using pixel size (A4 at 300 DPI)

                // Convert canvas to image and add it to the PDF
                const canvasImage = combinedCanvas.toDataURL("image/png"); // Convert canvas to PNG
                pdf.addImage(canvasImage, 'PNG', 0, 0, 1193, 1680); // Add the canvas image to the PDF, scaled to A4 size in pixels
                pdf.save('combined_image.pdf'); // Save the PDF
            }

        });



</script>

</body>
{% endblock %}
</html>
