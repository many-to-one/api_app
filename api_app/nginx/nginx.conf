upstream my_app {
    server web:8004;
}

server {

    listen 80;
    server_name sellior.pl www.sellior.pl;

    location / {
        proxy_pass http://my_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/web/staticfiles;
    }
}
